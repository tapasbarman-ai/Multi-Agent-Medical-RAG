<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical AI Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <!-- Left Sidebar Navigation -->
        <div class="nav-sidebar">
            <div class="nav-item active" title="Chat">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
            </div>
            <!-- Removed unused icons: History, Settings, Resources, Appointments -->
        </div>

        <!-- Chat Sidebar -->
        <div class="chat-sidebar">
            <div class="sidebar-header">
                <div class="workspace-selector">
                    <span class="workspace-text">Medical AI Assistant</span>
                    <svg class="dropdown-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9" />
                    </svg>
                </div>
            </div>

            <button class="new-chat-btn" onclick="newChat()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                <span>New Chat</span>
            </button>

            <div class="search-container">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.35-4.35" />
                </svg>
                <input type="text" placeholder="Search chats..." class="search-input">
            </div>

            <div class="chat-list" id="chatList">
                <div class="chat-list-empty">
                    <em>No chats.</em>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="top-bar-left">
                    <button class="collapse-btn" onclick="toggleSidebar()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg>
                    </button>
                    <div class="model-selector" style="cursor: default;">
                        <span class="model-name">Medical Coordinator</span>
                        <!-- Removed dropdown icon since there's no selection -->
                    </div>
                </div>
                <div class="top-bar-right">
                    <button class="icon-btn" onclick="toggleProfileModal()" id="profileToggle" title="Patient Profile" style="position: relative;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                        <span id="profileActiveDot" style="display:none; position:absolute; top:2px; right:2px; width:7px; height:7px; border-radius:50%; background:var(--accent); border:1.5px solid var(--bg-secondary);"></span>
                    </button>
                    <button class="icon-btn" onclick="toggleTheme()" id="themeToggle" title="Toggle theme">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Chat Area -->
            <div class="chat-area" id="chatArea"></div>

            <!-- Input Area -->
            <div class="input-section">
                <!-- Image Preview Container -->
                <div class="image-preview-container" id="imagePreviewContainer" style="display:none; max-width: 850px; margin: 0 auto 12px; position: relative;">
                    <div style="position: relative; display: inline-block; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 6px;">
                        <img id="imagePreview" src="" style="max-height: 80px; border-radius: 8px; display: block;" />
                        <button onclick="removeSelectedImage()" style="position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; border-radius: 50%; background: #ef4444; color: white; border: none; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: var(--shadow-sm); transition: var(--transition);">✕</button>
                    </div>
                </div>

                <div class="input-wrapper">
                    <!-- Image Attachment Button -->
                    <button class="attach-btn" id="attachBtn" onclick="triggerImageUpload()" title="Attach image" style="background:none; border:none; color:var(--text-tertiary); cursor:pointer; padding:6px; display:flex; align-items:center; transition:var(--transition); margin-right:4px;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                        </svg>
                    </button>
                    <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageSelection(event)">

                    <textarea class="message-input" id="messageInput" placeholder="Send a message or attach image..." rows="1"
                        onkeydown="handleKeyPress(event)"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13" />
                            <polygon points="22 2 15 22 11 13 2 9 22 2" />
                        </svg>
                    </button>
                </div>
                <div class="input-footer">
                    <span class="disclaimer-text">For informational purposes only. Consult healthcare professionals
                        for medical advice.</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Marked.js for better formatting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Patient Profile Modal -->
    <div id="profileModal" class="modal-overlay" style="display: none;" onclick="if(event.target === this) toggleProfileModal()">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Patient Profile</h3>
                <button class="modal-close-btn" onclick="toggleProfileModal()">✕</button>
            </div>
            <div class="modal-body">
                <p class="modal-subtext">Providing patient details helps customize clinical insights and warnings.</p>
                <div class="form-row">
                    <div class="form-group">
                        <label for="intakeAge">Age</label>
                        <input type="number" id="intakeAge" placeholder="Age" min="0" max="120">
                    </div>
                    <div class="form-group">
                        <label for="intakeSex">Sex</label>
                        <select id="intakeSex" onchange="checkPregnancyVisibility()">
                            <option value="">Select</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>
                <div id="pregnancyContainer" style="display:none; align-items:center; gap:8px; margin-bottom:16px;">
                    <input type="checkbox" id="intakePregnancy" style="cursor:pointer; width:auto; margin:0;">
                    <label style="cursor:pointer; font-weight:normal; margin:0; font-size:13px; color:var(--text-secondary);" for="intakePregnancy">Currently Pregnant</label>
                </div>
                <div class="form-group">
                    <label for="intakeConditions">Chronic Conditions (e.g. Asthma, Diabetes)</label>
                    <input type="text" id="intakeConditions" placeholder="Conditions">
                </div>
                <div class="form-group">
                    <label for="intakeAllergies">Known Drug Allergies</label>
                    <input type="text" id="intakeAllergies" placeholder="Allergies">
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-save-btn" onclick="saveProfileAndClose()">Save Profile</button>
            </div>
        </div>
    </div>

    <script>
        let currentChatId = null;
        let isTyping = false;
        let selectedImageBase64 = null; // Holds the selected image as Base64 string
        const API_URL = window.location.origin;

        const WELCOME_HTML = `
            <div class="welcome-screen">
                <div class="welcome-icon">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
                    </svg>
                </div>
                <h1>Medical AI Assistant</h1>
                <p>Consult local databases, PubMed, EuropePMC, and web resources for evidence-based guidance.</p>

                <div class="suggestion-cards">
                    <div class="suggestion-card" onclick="askSample('What are the common symptoms of Type 2 diabetes?')">
                        <div class="suggestion-content">
                            <div class="suggestion-title">Symptom Evaluation</div>
                            <div class="suggestion-text">Explore symptoms and clinical presentations.</div>
                        </div>
                    </div>
                    <div class="suggestion-card" onclick="askSample('Find recent clinical trials for Alzheimer\\'s disease treatments.')">
                        <div class="suggestion-content">
                            <div class="suggestion-title">Clinical Research</div>
                            <div class="suggestion-text">Query PubMed and publication archives for evidence.</div>
                        </div>
                    </div>
                    <div class="suggestion-card" onclick="askSample('What are the standard-of-care treatments for chronic hypertension?')">
                        <div class="suggestion-content">
                            <div class="suggestion-title">Treatment Guidelines</div>
                            <div class="suggestion-text">Review established standards and chronic care paths.</div>
                        </div>
                    </div>
                    <div class="suggestion-card" onclick="askSample('Explain what abnormalities are typically looked for in a chest X-ray.')">
                        <div class="suggestion-content">
                            <div class="suggestion-title">Diagnostic Vision</div>
                            <div class="suggestion-text">Attach X-rays, skin scans, or reports for analysis.</div>
                        </div>
                    </div>
                </div>
            </div>
        `;

        function triggerImageUpload() {
            document.getElementById('imageInput').click();
        }

        function handleImageSelection(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Validate file type
            if (!file.type.startsWith('image/')) {
                alert('Please select an image file.');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                selectedImageBase64 = e.target.result;
                
                // Show preview
                const previewContainer = document.getElementById('imagePreviewContainer');
                const previewImg = document.getElementById('imagePreview');
                previewImg.src = selectedImageBase64;
                previewContainer.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function removeSelectedImage() {
            selectedImageBase64 = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('imagePreviewContainer').style.display = 'none';
            document.getElementById('imagePreview').src = '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            loadProfile();
            loadChatHistory();
            newChat();
            setupAutoResize();
        });

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }

        function loadTheme() {
            const theme = localStorage.getItem('theme');
            if (theme === 'light') {
                document.body.classList.add('light-mode');
            }
        }

        function toggleSidebar() {
            document.querySelector('.chat-sidebar').classList.toggle('collapsed');
        }

        function newChat() {
            currentChatId = Date.now().toString();
            clearChatDisplay();
            saveChatToHistory();
            updateChatList();
        }

        function clearChatDisplay() {
            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML = WELCOME_HTML;
        }

        function addMessage(text, isUser, toolUsed = null, imageData = null) {
            const chatArea = document.getElementById('chatArea');

            const welcomeScreen = chatArea.querySelector('.welcome-screen');
            if (welcomeScreen) {
                welcomeScreen.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;

            // Tool Badge for Bot
            let toolBadge = '';
            if (!isUser && toolUsed && toolUsed !== 'unknown') {
                const toolNames = {
                    'rag': 'Knowledge Base',
                    'research': 'Research Papers',
                    'pubmed': 'PubMed Papers',
                    'websearch': 'Web Search',
                    'multi': 'Multi-Source',
                    'vision': 'Clinical Vision'
                };
                const toolName = toolNames[toolUsed] || toolUsed;
                toolBadge = `<div class="tool-badge">${toolName}</div>`;
            }

            // Render image if present
            let imageHtml = '';
            if (imageData) {
                imageHtml = `<img src="${imageData}" style="max-width: 100%; max-height: 250px; border-radius: 10px; margin-bottom: 10px; display: block; border: 1px solid var(--border);" />`;
            }

            messageDiv.innerHTML = `
                <div class="message-avatar">
                    ${isUser ?
                    '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>' :
                    '<div class="bot-icon">AI</div>'
                }
                </div>
                <div class="message-content">
                    ${toolBadge}
                    ${imageHtml}
                    <div class="markdown-body">${formatMessage(text)}</div>
                </div>
            `;

            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function formatMessage(text) {
            // Use marked.js if available, otherwise fallback
            if (typeof marked !== 'undefined') {
                return marked.parse(text);
            }
            return text.replace(/\n/g, '<br>');
        }

        function showTypingIndicator() {
            const chatArea = document.getElementById('chatArea');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot-message';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="message-avatar"><div class="bot-icon">AI</div></div>
                <div class="message-content">
                    <div class="typing-indicator"><span></span><span></span><span></span></div>
                </div>`;
            chatArea.appendChild(typingDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if ((!message && !selectedImageBase64) || isTyping) return;

            // 1. Show User Message
            const imageToSend = selectedImageBase64;
            addMessage(message, true, null, imageToSend);
            input.value = '';
            input.style.height = 'auto';
            if (imageToSend) {
                removeSelectedImage();
            }

            isTyping = true;
            document.getElementById('sendBtn').disabled = true;
            input.disabled = true;
            showTypingIndicator();

            try {
                // 2. Send to Backend
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: message,
                        chat_id: currentChatId,
                        intake_data: getPatientIntakeData(),
                        image: imageToSend
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }

                removeTypingIndicator();

                // Create a temporary message container for bot response
                const chatArea = document.getElementById('chatArea');
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message bot-message';
                
                // Progress box above the response text
                const progressDiv = document.createElement('div');
                progressDiv.className = 'progress-container';
                progressDiv.style.marginBottom = '12px';
                progressDiv.style.fontSize = '12px';
                progressDiv.style.color = 'var(--text-tertiary)';
                progressDiv.style.background = 'rgba(255,255,255,0.02)';
                progressDiv.style.padding = '8px 12px';
                progressDiv.style.borderRadius = '8px';
                progressDiv.style.border = '1px solid var(--border)';
                progressDiv.style.display = 'none';

                const progressList = document.createElement('div');
                progressList.className = 'progress-steps';
                progressList.style.display = 'flex';
                progressList.style.flexDirection = 'column';
                progressList.style.gap = '4px';
                
                progressDiv.innerHTML = `<strong style="display:block;margin-bottom:6px;color:var(--text-secondary);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;">Coordination Progress:</strong>`;
                progressDiv.appendChild(progressList);

                // Tool badge container
                const badgeContainer = document.createElement('div');
                badgeContainer.className = 'tool-badge-container';

                // Text body container
                const textDiv = document.createElement('div');
                textDiv.className = 'markdown-body';
                textDiv.innerHTML = '<em>Thinking...</em>';

                messageDiv.innerHTML = `
                    <div class="message-avatar">
                        <div class="bot-icon">AI</div>
                    </div>
                    <div class="message-content"></div>
                `;
                
                const contentDiv = messageDiv.querySelector('.message-content');
                contentDiv.appendChild(progressDiv);
                contentDiv.appendChild(badgeContainer);
                contentDiv.appendChild(textDiv);
                
                chatArea.appendChild(messageDiv);
                chatArea.scrollTop = chatArea.scrollHeight;

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let accumulatedData = '';
                let botResponseText = '';
                let hasBegunText = false;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    accumulatedData += decoder.decode(value, { stream: true });
                    const lines = accumulatedData.split('\n\n');
                    
                    // Save the last partial line back to accumulatedData
                    accumulatedData = lines.pop();

                    for (const line of lines) {
                        if (!line.trim()) continue;
                        if (line.startsWith('data: ')) {
                            const jsonStr = line.slice(6);
                            try {
                                const data = JSON.parse(jsonStr);
                                
                                if (data.type === 'status') {
                                    progressDiv.style.display = 'block';
                                    const step = document.createElement('div');
                                    step.className = 'progress-step';
                                    step.style.padding = '2px 0';
                                    step.style.display = 'flex';
                                    step.style.alignItems = 'center';
                                    step.style.gap = '6px';
                                    step.innerHTML = `<span style="color:var(--accent)">●</span> <span>${data.message}</span>`;
                                    progressList.appendChild(step);
                                    chatArea.scrollTop = chatArea.scrollHeight;
                                }
                                else if (data.type === 'token') {
                                    if (!hasBegunText) {
                                        textDiv.innerHTML = '';
                                        hasBegunText = true;
                                    }
                                    botResponseText += data.text;
                                    textDiv.innerHTML = formatMessage(botResponseText);
                                    chatArea.scrollTop = chatArea.scrollHeight;
                                }
                                else if (data.type === 'complete') {
                                    // Set final full answer and tool badge
                                    botResponseText = data.answer;
                                    textDiv.innerHTML = formatMessage(botResponseText);
                                    
                                    if (data.tool_used && data.tool_used !== 'unknown') {
                                        const toolNames = {
                                            'rag': 'Knowledge Base',
                                            'research': 'Research Papers',
                                            'pubmed': 'PubMed Papers',
                                            'websearch': 'Web Search',
                                            'multi': 'Multi-Source'
                                        };
                                        const toolName = toolNames[data.tool_used] || data.tool_used;
                                        badgeContainer.innerHTML = `<div class="tool-badge" style="display:inline-block;margin-bottom:8px;">${toolName}</div>`;
                                    }
                                    
                                              if (data.sources && data.sources.length > 0) {
                                        const sourcesDiv = document.createElement('div');
                                        sourcesDiv.className = 'sources-container';
                                        sourcesDiv.style.marginTop = '16px';
                                        sourcesDiv.style.paddingTop = '12px';
                                        sourcesDiv.style.borderTop = '1px solid var(--border)';
                                        
                                        let cardsHtml = `<strong style="display:block;margin-bottom:8px;font-size:12px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;">Reference Sources:</strong>`;
                                        cardsHtml += `<div class="source-cards" style="display:grid;grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));gap:10px;">`;
                                        
                                        data.sources.forEach(src => {
                                            cardsHtml += `
                                                <a href="${src.url}" target="_blank" class="source-card" style="display:block;padding:8px 12px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:8px;text-decoration:none;color:inherit;transition:all 0.2s;">
                                                    <div style="font-size:10px;color:var(--text-tertiary);margin-bottom:4px;display:flex;align-items:center;gap:4px;">
                                                         <span>${src.type.toUpperCase()}</span>
                                                    </div>
                                                    <div style="font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-primary);" title="${src.title}">${src.title}</div>
                                                </a>
                                            `;
                                        });
                                        cardsHtml += `</div>`;
                                        sourcesDiv.innerHTML = cardsHtml;
                                        contentDiv.appendChild(sourcesDiv);
                                        
                                        // Add hover micro-animations dynamically
                                        const cards = sourcesDiv.querySelectorAll('.source-card');
                                        cards.forEach(card => {
                                            card.onmouseenter = () => {
                                                card.style.background = 'rgba(255,255,255,0.06)';
                                                card.style.borderColor = 'var(--accent)';
                                                card.style.transform = 'translateY(-1px)';
                                            };
                                            card.onmouseleave = () => {
                                                card.style.background = 'rgba(255,255,255,0.02)';
                                                card.style.borderColor = 'var(--border)';
                                                card.style.transform = 'translateY(0)';
                                            };
                                        });
                                    }
                                    
                                    // Update sidebar chat history
                                    updateChatList();
                                }
                                else if (data.type === 'error') {
                                    textDiv.innerHTML = `<span style="color:#ef4444;">Error: ${data.message}</span>`;
                                }
                            } catch (e) {
                                console.error('Error parsing SSE line:', e, line);
                            }
                        }
                    }
                }

            } catch (error) {
                console.error('Error:', error);
                removeTypingIndicator();
                addMessage('Could not connect to server or connection lost.', false);
            } finally {
                isTyping = false;
                document.getElementById('sendBtn').disabled = false;
                input.disabled = false;
                input.focus();
            }
        }

        /* Patient Intake Form Helper Functions */
        function toggleProfileModal() {
            const modal = document.getElementById('profileModal');
            if (modal.style.display === 'none' || !modal.style.display) {
                modal.style.display = 'flex';
            } else {
                modal.style.display = 'none';
            }
        }

        function checkPregnancyVisibility() {
            const sexSelect = document.getElementById('intakeSex');
            const container = document.getElementById('pregnancyContainer');
            if (sexSelect.value === 'female') {
                container.style.display = 'flex';
            } else {
                container.style.display = 'none';
                document.getElementById('intakePregnancy').checked = false;
            }
        }

        function saveProfileAndClose() {
            const age = document.getElementById('intakeAge').value.trim();
            const sex = document.getElementById('intakeSex').value;
            const pregnant = document.getElementById('intakePregnancy').checked;
            const conditions = document.getElementById('intakeConditions').value.trim();
            const allergies = document.getElementById('intakeAllergies').value.trim();

            localStorage.setItem('profile_age', age);
            localStorage.setItem('profile_sex', sex);
            localStorage.setItem('profile_pregnant', pregnant);
            localStorage.setItem('profile_conditions', conditions);
            localStorage.setItem('profile_allergies', allergies);

            updateProfileActiveDot();
            toggleProfileModal();
        }

        function loadProfile() {
            document.getElementById('intakeAge').value = localStorage.getItem('profile_age') || '';
            document.getElementById('intakeSex').value = localStorage.getItem('profile_sex') || '';
            document.getElementById('intakePregnancy').checked = localStorage.getItem('profile_pregnant') === 'true';
            document.getElementById('intakeConditions').value = localStorage.getItem('profile_conditions') || '';
            document.getElementById('intakeAllergies').value = localStorage.getItem('profile_allergies') || '';
            
            checkPregnancyVisibility();
            updateProfileActiveDot();
        }

        function updateProfileActiveDot() {
            const age = document.getElementById('intakeAge').value.trim();
            const sex = document.getElementById('intakeSex').value;
            const conditions = document.getElementById('intakeConditions').value.trim();
            const allergies = document.getElementById('intakeAllergies').value.trim();
            const activeDot = document.getElementById('profileActiveDot');
            
            if (age || sex || conditions || allergies) {
                activeDot.style.display = 'block';
            } else {
                activeDot.style.display = 'none';
            }
        }

        function getPatientIntakeData() {
            const age = document.getElementById('intakeAge').value.trim();
            const sex = document.getElementById('intakeSex').value;
            const pregnant = document.getElementById('intakePregnancy').checked;
            const conditions = document.getElementById('intakeConditions').value.trim();
            const allergies = document.getElementById('intakeAllergies').value.trim();

            if (!age && !sex && !conditions && !allergies) {
                return null;
            }

            return {
                age: age || 'Not specified',
                sex: sex || 'Not specified',
                pregnant: sex === 'female' ? pregnant : false,
                conditions: conditions || 'None reported',
                allergies: allergies || 'None reported'
            };
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function askSample(question) {
            document.getElementById('messageInput').value = question;
            sendMessage();
        }

        async function saveChatToHistory() {
            try {
                await fetch(`${API_URL}/chats`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: currentChatId, title: 'New Chat' })
                });
            } catch (error) { console.error('Error saving chat:', error); }
        }

        async function loadChatHistory() {
            await updateChatList();
        }

        async function updateChatList() {
            const chatList = document.getElementById('chatList');
            try {
                const response = await fetch(`${API_URL}/chats`);
                const data = await response.json();
                const chats = data.chats || [];

                if (chats.length === 0) {
                    chatList.innerHTML = '<div class="chat-list-empty"><em>No chats.</em></div>';
                    return;
                }

                chatList.innerHTML = '';
                chats.forEach(chat => {
                    const item = document.createElement('div');
                    item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                    // Important: prevent delete button click from triggering loadChat
                    item.onclick = (e) => {
                        if (!e.target.closest('.delete-chat-btn')) {
                            loadChat(chat.id);
                        }
                    };

                    item.innerHTML = `
                        <div class="chat-item-content">
                            <div class="chat-item-title">${chat.title}</div>
                            <div class="chat-item-time">${formatTime(chat.updated_at || chat.created_at)}</div>
                        </div>
                        <button class="delete-chat-btn" onclick="deleteChat('${chat.id}')" title="Delete Chat">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    `;
                    chatList.appendChild(item);
                });

            } catch (error) { console.error('Error loading chats:', error); }
        }

        async function loadChat(chatId) {
            currentChatId = chatId;
            try {
                const response = await fetch(`${API_URL}/chats/${chatId}`);
                const data = await response.json();

                if (data.chat && data.messages) {
                    clearChatDisplay();
                    data.messages.forEach(msg => {
                        addMessage(msg.message, msg.is_user, null, msg.image_data);
                    });
                    updateChatList();
                }
            } catch (error) { console.error('Error loading chat:', error); }
        }

        async function deleteChat(chatId) {
            if (!confirm('Are you sure you want to delete this chat?')) return;

            try {
                await fetch(`${API_URL}/chats/${chatId}`, { method: 'DELETE' });
                if (currentChatId === chatId) {
                    newChat();
                } else {
                    updateChatList();
                }
            } catch (error) { console.error('Error deleting chat:', error); }
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            const diffHours = Math.floor(diffMins / 60);
            if (diffHours < 24) return `${diffHours}h ago`;
            return date.toLocaleDateString();
        }

        function setupAutoResize() {
            const input = document.getElementById('messageInput');
            input.addEventListener('input', function () {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 200) + 'px';
            });
        }
    </script>
</body>

</html>
